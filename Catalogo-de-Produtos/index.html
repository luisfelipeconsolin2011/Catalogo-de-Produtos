<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Catálogo de Produtos</h1>

        <p>
            Os produtos abaixo foram carregados a partir de um Array em JavaScript.
        </p>

        <div class="resumo">

            <div class = "box">

                <span id = "quantidadeProdutos">Produtos Cadastrados</span>

            </div>
        </div>
    </header>

    <main>

        <div class = "pesquisa">

            <input
                type="text"
                placeholder="🔍Pesquisar Produto..."
            >
        </div>

        <section id="listaProdutos" class="lista-produtos">
        </section>
    </main>

    <script src="produtos.js"></script>
    <script src="script.js"></script>
</body>
</html>
